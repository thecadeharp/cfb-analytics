name: Possession Ledger Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thi-possession-ledger-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install historical PBP dependencies
        run: pip install pandas numpy requests pyarrow
      - name: Preserve production Model A files
        run: sha256sum data/projections.json data/cfb_metrics.json scripts/build_projections.py > /tmp/thi-model-a-before.sha256
      - name: Build ephemeral research possession ledgers and audit
        run: python scripts/research_possession_ledger.py
      - name: Validate audit only
        run: |
          sha256sum --check /tmp/thi-model-a-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/research/possession_ledger_audit.json').read_text())
          seasons = report['seasons']
          assert [item['season'] for item in seasons] == list(range(2019, 2026))
          assert all(item['drives'] > 1000 for item in seasons)
          assert report['meta']['status'] == 'research_only_possession_ledger_quality_audit'
          PY
      - name: Commit research audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/possession_ledger_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit historical possession ledger quality"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
