name: Audit Model A Market Disagreements

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-model-a-market-disagreements
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run historical disagreement audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_model_a_market_disagreement.py

      - name: Prove production files were not modified
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- \
            data/projections.json \
            data/frozen/2026_week1_modelA_frozen.json \
            data/cfb_metrics.json \
            data/hfa_2026.json \
            app.js \
            scripts/build_projections.py; then
            echo "ERROR: audit modified a protected production file."
            exit 1
          fi

      - name: Commit audit reports only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/reports/model_a_market_disagreement_audit.json \
            data/reports/model_a_market_disagreement_audit.txt

          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi

          git commit -m "Audit Model A market disagreements"
          git pull --rebase origin main
          git push origin HEAD:main
