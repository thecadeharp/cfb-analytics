name: Public Release Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * *"
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait briefly for CDN publication
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 20
      - name: Verify responsive public status contracts
        run: python -m unittest scripts.test_public_data_status -v
      - name: Verify public data contracts
        run: |
          attempts=6
          for attempt in $(seq 1 "$attempts"); do
            if python scripts/verify_public_release.py --base-url https://thehammerindex.com; then
              exit 0
            fi

            if [ "$attempt" -eq "$attempts" ]; then
              echo "Public data contracts remained inconsistent after $attempts attempts."
              exit 1
            fi

            echo "Public data is still publishing; retrying in 20 seconds ($attempt/$attempts)."
            sleep 20
          done
