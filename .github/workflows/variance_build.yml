name: Build Variance Historical Data

on:
  workflow_dispatch:

concurrency:
  group: variance-historical-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Protect Model A files
        run: |
          sha256sum \
            data/projections.json \
            data/hfa_2026.json \
            scripts/build_projections.py \
            > /tmp/model_a_before.sha256

      - name: Build variance history
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/variance_pull.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/variance_historical.json")
          if not path.exists():
              raise SystemExit("data/variance_historical.json was not created")

          payload = json.loads(path.read_text(encoding="utf-8"))
          cohorts = payload.get("cohorts", {})
          expected = {"full_reset", "qb_swap", "coordinator"}
          if set(cohorts) != expected:
              raise SystemExit(f"Unexpected cohorts: {sorted(cohorts)}")

          for key, minimum in (("full_reset", 25), ("qb_swap", 100)):
              cohort = cohorts[key]
              n = cohort.get("aggregate", {}).get("n", 0)
              distribution_n = sum(row.get("count", 0) for row in cohort.get("distribution", []))
              if cohort.get("data_status") != "verified" or n < minimum:
                  raise SystemExit(f"{key} is sparse or unverified: status={cohort.get('data_status')}, n={n}")
              if distribution_n != n:
                  raise SystemExit(f"{key} distribution total {distribution_n} does not equal n={n}")

          coordinator = cohorts["coordinator"]
          if coordinator.get("data_status") != "unavailable":
              raise SystemExit("Coordinator cohort must not be inferred without verified OC history")

          print("Variance JSON validation passed")
          PY

      - name: Verify Model A remained unchanged
        run: sha256sum --check /tmp/model_a_before.sha256

      - name: Commit variance history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/variance_historical.json
          if git diff --cached --quiet; then
            echo "Variance history is already current."
            exit 0
          fi
          git commit -m "Build verified variance historical data"
          git pull --rebase origin main
          git push origin HEAD:main
