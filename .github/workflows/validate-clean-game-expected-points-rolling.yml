name: Validate Clean Game Expected Points Rolling
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: sha256sum data/projections.json data/cfb_metrics.json scripts/build_projections.py index.html app.js postgame-analytics.js > /tmp/thi-roll-before.sha256
      - run: python scripts/validate_clean_game_expected_points_rolling.py
      - run: |
          sha256sum --check /tmp/thi-roll-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/research/expected_points_rolling_validation.json').read_text())
          assert r['meta']['training_ready'] is False
          assert [x['test_year'] for x in r['folds']] == [2022,2023,2024]
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/expected_points_rolling_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate clean-game expected-points baseline'
          git pull --rebase origin main
          git push origin HEAD:main
