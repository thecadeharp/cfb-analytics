name: CFB Live Score Pulse

on:
  workflow_dispatch:
    inputs:
      one_shot:
        description: "Refresh once without retaining the active-game polling loop"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [live-score-pulse]
  schedule:
    # Offset from the top of the hour, where GitHub documents the heaviest
    # schedule congestion. External monitors may use repository_dispatch.
    - cron: "2-57/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: thi-live-score-pulse
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scoreboard dependencies
        run: python -m pip install requests pandas pyarrow
      - name: Fetch live and completed scores
        env:
          CFB_SEASON: "2026"
        run: |
          cp data/results.json /tmp/results-before.json
          cp data/live_scores.json /tmp/live-before.json
          python scripts/fetch_results_no_cfbd.py
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.load(open("/tmp/results-before.json", encoding="utf-8"))
          after=json.load(open("data/results.json", encoding="utf-8"))
          before_rows=before.get("games") or before.get("results") or []
          after_rows=after.get("games") or after.get("results") or []
          Path("/tmp/thi-results-changed").write_text(
              "1\n" if before_rows != after_rows else "",
              encoding="utf-8",
          )
          PY
      - name: Suppress timestamp-only idle refreshes
        run: |
          python - <<'PY'
          import json, shutil
          pairs = [
              ("/tmp/results-before.json", "data/results.json"),
              ("/tmp/live-before.json", "data/live_scores.json"),
          ]
          def semantic(path):
              payload=json.load(open(path, encoding="utf-8"))
              payload.get("meta", {}).pop("generated_at", None)
              return payload
          live=json.load(open("data/live_scores.json", encoding="utf-8"))
          unchanged=all(semantic(before)==semantic(after) for before,after in pairs)
          if unchanged and not (live.get("games") or []):
              for before,after in pairs: shutil.copyfile(before,after)
              print("No active game or result change; suppressed timestamp-only commit.")
          PY
      - name: Validate scoreboard contracts
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          for path in ("data/results.json", "data/live_scores.json"):
              payload=json.load(open(path, encoding="utf-8"))
              stamp=datetime.fromisoformat(payload["meta"]["generated_at"].replace("Z", "+00:00"))
              assert payload["meta"]["season"] == 2026
          live=json.load(open("data/live_scores.json"))
          if live.get("games"):
              stamp=datetime.fromisoformat(live["meta"]["generated_at"].replace("Z", "+00:00"))
              assert (datetime.now(timezone.utc)-stamp).total_seconds() < 600
          assert json.load(open("data/results.json"))["meta"]["completed_games"] >= 300
          PY
      - name: Publish scoreboard pulse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/live_scores.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh CFB live score pulse"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Dispatch settlement when a completed result changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s /tmp/thi-results-changed ]]; then
            gh workflow run settle-results-no-cfbd.yml --ref main
            echo "Completed result changed; dispatched settlement."
          fi
      - name: Continue polling while a game remains active
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.one_shot != true }}
        env:
          CFB_SEASON: "2026"
          GH_TOKEN: ${{ github.token }}
        run: |
          live_count=$(python - <<'PY'
          import json
          print(len(json.load(open("data/live_scores.json", encoding="utf-8")).get("games") or []))
          PY
          )
          if [[ "$live_count" -eq 0 ]]; then
            echo "No active games; continuous pulse not needed."
            exit 0
          fi

          echo "$live_count active game(s); retaining a five-minute fallback pulse."
          for pulse in $(seq 1 56); do
            sleep 300
            cp data/results.json /tmp/results-before-loop.json
            python scripts/fetch_results_no_cfbd.py

            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          before=json.load(open("/tmp/results-before-loop.json", encoding="utf-8"))
          after=json.load(open("data/results.json", encoding="utf-8"))
          before_rows=before.get("games") or before.get("results") or []
          after_rows=after.get("games") or after.get("results") or []
          Path("/tmp/thi-loop-results-changed").write_text(
              "1\n" if before_rows != after_rows else "",
              encoding="utf-8",
          )
          for path in ("data/results.json", "data/live_scores.json"):
              payload=json.load(open(path, encoding="utf-8"))
              stamp=datetime.fromisoformat(payload["meta"]["generated_at"].replace("Z", "+00:00"))
              assert payload["meta"]["season"] == 2026
              assert (datetime.now(timezone.utc)-stamp).total_seconds() < 600
          PY

            git add data/results.json data/live_scores.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh CFB live score pulse"
              for attempt in 1 2 3 4 5; do
                git fetch origin main
                git rebase origin/main
                if git push origin HEAD:main; then break; fi
                [[ "$attempt" -eq 5 ]] && exit 1
                sleep 2
              done
            fi

            if [[ -s /tmp/thi-loop-results-changed ]]; then
              gh workflow run settle-results-no-cfbd.yml --ref main
              echo "Completed result changed during fallback pulse; dispatched settlement."
            fi

            live_count=$(python - <<'PY'
          import json
          print(len(json.load(open("data/live_scores.json", encoding="utf-8")).get("games") or []))
          PY
          )
            echo "Fallback pulse $pulse complete; $live_count active game(s)."
            if [[ "$live_count" -eq 0 ]]; then
              exit 0
            fi
          done

          echo "Active-game fallback reached its polling limit."
