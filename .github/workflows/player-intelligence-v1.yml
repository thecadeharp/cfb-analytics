name: Player Intelligence and Team Luck v1

on:
  workflow_dispatch:
    inputs:
      through_week:
        description: "Completed week (0 = latest source week)"
        required: false
        default: "0"
  schedule:
    # Sunday 10:15 AM ET during the season, after weekly team metrics.
    - cron: "15 14 * * 0"

permissions:
  contents: write

concurrency:
  group: thi-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install display-data dependencies
        run: python -m pip install pandas==2.2.3 pyarrow==25.0.0

      - name: Preserve Model A and production projection files
        run: |
          sha256sum data/projections.json data/cfb_metrics.json scripts/build_projections.py > /tmp/thi-player-before.sha256

      - name: Build team luck and game-type splits
        run: python scripts/build_team_intelligence.py

      - name: Build player intelligence
        env:
          THROUGH_WEEK: ${{ github.event.inputs.through_week || '0' }}
        run: |
          args=()
          if [ "$THROUGH_WEEK" != "0" ]; then args+=(--through-week "$THROUGH_WEEK"); fi
          python scripts/build_player_intelligence.py "${args[@]}"

      - name: Audit player ratings and roster joins
        run: |
          python -m unittest scripts/test_cfb_player_intelligence.py
          python scripts/audit_cfb_player_intelligence.py

      - name: Build next-game player projection research board
        run: |
          python -m unittest scripts/test_cfb_player_projections.py
          python scripts/build_cfb_player_projections.py

      - name: Validate output contracts
        run: |
          python -m json.tool data/team_intelligence.json >/dev/null
          python -m json.tool data/player_intelligence.json >/dev/null
          python -m json.tool data/player_intelligence_audit.json >/dev/null
          python -m json.tool data/player_projections.json >/dev/null
          python - <<'PY'
          import json
          team = json.load(open('data/team_intelligence.json'))
          player = json.load(open('data/player_intelligence.json'))
          audit = json.load(open('data/player_intelligence_audit.json'))
          projections = json.load(open('data/player_projections.json'))
          assert team['meta']['model_usage'] == 'display_only_not_used_by_model_a'
          assert player['meta']['model_usage'] == 'display_only_not_used_by_model_a'
          assert player['meta']['rating_version'] == 'thi-cfb-player-production-v2.0'
          assert audit['meta']['status'] == 'passed'
          assert all(audit['checks'].values())
          assert len(team['teams']) >= 130
          assert len(player['teams']) >= 130
          assert len(player['players']) >= 3000
          assert projections['meta']['status'] == 'research_only'
          assert projections['meta']['model_usage'] == 'display_only_not_used_by_model_a'
          assert projections['meta']['market_data_usage'] == 'none_ingested_retained_or_displayed'
          assert projections['meta']['intended_use'].startswith('player_performance_forecasting')
          assert len(projections['projections']) >= 100
          assert all(row['position_group'] in {'QB','RB','WR','TE'} for row in projections['projections'])
          assert player['meta']['heisman_status'] in {'NOT_RUN', 'BOARD_ONLY_CALIBRATION_GATE_FAILED', 'PASSED_FOR_BETA_PROBABILITIES'}
          if player['meta']['heisman_status'] != 'PASSED_FOR_BETA_PROBABILITIES':
              assert all(row['win_probability'] is None and row['finalist_probability'] is None for row in player['heisman_board'])
          smith = next(row for row in player['players'].values() if row['name'] == 'Jeremiah Smith' and row['team'] == 'Ohio State')
          assert smith['position_group'] == 'WR'
          assert smith['primary_volume'] >= smith['traditional']['targets']
          assert smith['rating'] is not None
          assert smith['rating_components']['final_rating'] == smith['rating']
          assert [player['players'][athlete_id]['name'] for athlete_id in player['leaderboards']['WR'][:3]] == [
              'Jesse Legree', 'Jeremiah Smith', 'KJ Duff'
          ]
          assert all(row['name'] != 'Julian Sayin' for row in player['heisman_board'])
          assert [row['name'] for row in player['heisman_board'][:5]] == [
              'Darian Mensah', 'Jeremiah Smith', 'Malachi Toney', 'Trinidad Chambliss', 'Jesse Legree'
          ]
          print(f"Validated {len(team['teams'])} team summaries and {len(player['players'])} rostered players")
          PY

      - name: Verify Model A isolation
        run: sha256sum --check /tmp/thi-player-before.sha256

      - name: Commit display and research data only
        run: |
          if git diff --quiet -- data/team_intelligence.json data/player_intelligence.json data/player_intelligence_audit.json data/player_projections.json; then
            echo "No player-intelligence changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team_intelligence.json data/player_intelligence.json data/player_intelligence_audit.json data/player_projections.json
          git commit -m "Refresh THI player intelligence and team luck"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
