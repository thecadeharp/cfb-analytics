name: Build Team Metric Profiles

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Advanced Metrics v2"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: thi-data-writer
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build shared percentile contract
        run: python scripts/build_team_metric_profiles.py
      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team_metric_profiles.json
          if git diff --cached --quiet; then
            echo "Team metric profiles unchanged."
            exit 0
          fi
          git commit -m "Refresh team metric profiles"
          git pull --rebase origin main
          git push
