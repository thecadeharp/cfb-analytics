name: External Ratings v1

on:
  workflow_dispatch:

  schedule:
    # Refresh after SportsDataverse's weekly FPI capture.
    - cron: "30 16 * * 1"

permissions:
  contents: write

jobs:
  build-external-ratings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow

      - name: Protect Model A files
        run: |
          sha256sum \
            data/projections.json \
            data/cfb_metrics.json \
            data/hfa_2026.json \
            scripts/build_projections.py \
            > /tmp/model-a-before.sha256

      - name: Build external ratings
        run: |
          python scripts/build_external_ratings.py

      - name: Verify Model A remained unchanged
        run: |
          sha256sum --check /tmp/model-a-before.sha256

      - name: Validate external ratings output
        run: |
          python - <<'PY'
          import json
          with open("data/external_ratings.json", encoding="utf-8") as file:
              data = json.load(file)
          assert data["meta"]["model_usage"] == "display_only_not_used_by_model_a"
          assert len(data.get("teams", {})) >= 130
          print("External ratings validation passed")
          PY

      - name: Commit external ratings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external_ratings.json
          git diff --staged --quiet || git commit -m "Refresh external ratings"
          git push

