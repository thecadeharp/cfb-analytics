name: Historical Cache

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Historical season to freeze (2019-2025)"
        required: true
        type: choice
        options:
          - "2019"
          - "2020"
          - "2021"
          - "2022"
          - "2023"
          - "2024"
          - "2025"

permissions:
  contents: write

jobs:
  cache-season:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Freeze selected historical season
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/cache_historical.py "${{ inputs.year }}"

      - name: Commit frozen historical cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/historical_cache/${{ inputs.year }}"

          git diff --staged --quiet || git commit -m "Cache historical CFB data ${{ inputs.year }}"
          git push
