name: THI Power Candidate v0.2 - Research Only

on:
  workflow_dispatch:
    inputs:
      through_week:
        description: '2026 completed-week cutoff (0 = latest source coverage)'
        required: true
        default: '0'
        type: string
  schedule:
    - cron: '45 14 * * 2'

permissions:
  contents: read

concurrency:
  group: thi-power-research
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 pyarrow==25.0.1
      - name: Record production and observed-rating files
        run: |
          sha256sum app.js index.html thi-ratings-hub.js scripts/build_projections.py data/cfb_metrics.json data/projections.json data/thi_observed_ratings.json > /tmp/thi-power-protected.sha256
      - uses: actions/cache@v4
        with:
          path: /tmp/thi-power-inputs
          key: thi-power-public-inputs-v2
      - name: Test chronology, symmetry and missing-input handling
        run: python -m unittest discover -s scripts -p test_research_thi_power.py
      - name: Fit and evaluate independent candidate
        env:
          THROUGH_WEEK: ${{ inputs.through_week || '0' }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/research_thi_power.py --input-dir /tmp/thi-power-inputs --output-dir /tmp/thi-power-report --download --through-week "$THROUGH_WEEK"
      - name: Verify protected files unchanged
        if: always()
        run: sha256sum --check /tmp/thi-power-protected.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: thi-power-candidate
          path: /tmp/thi-power-report/thi_power_candidate.json
          if-no-files-found: error
          retention-days: 90

