name: Historical Training Data Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Audit historical training data
        run: |
          python scripts/audit_historical_training_data.py

      - name: Commit audit report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/training/historical_training_audit.json

          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi

          git commit -m "Audit historical training data"
          git push
