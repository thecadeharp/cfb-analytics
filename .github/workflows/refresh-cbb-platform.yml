name: Refresh CBB Platform

on:
  workflow_dispatch:
    inputs:
      season:
        description: "CBBD season identifier"
        required: true
        default: "2027"
        type: string
      benchmark_season:
        description: "Completed season used for priors"
        required: true
        default: "2026"
        type: string
  schedule:
    - cron: "17 10,22 * * *"

permissions:
  contents: write

concurrency:
  group: thi-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scheduled events retain the commit that existed when the event was
          # queued. This workflow writes generated data back to main, so it
          # must begin from the current branch head to avoid rebase conflicts
          # with earlier serialized data-writer jobs.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve College Football and CBB research sources
        run: |
          sha256sum \
            data/projections.json \
            data/cfb_metrics.json \
            data/hfa_2026.json \
            scripts/build_projections.py \
            data/cbb/history/manifest.json \
            > /tmp/cbb-platform-before.sha256

      - name: Test the complete CBB publishing contract
        run: |
          python -m py_compile \
            scripts/build_cbb_data_foundation.py \
            scripts/build_cbb_player_research.py \
            scripts/build_cbb_walk_forward_model.py \
            scripts/build_cbb_home_court.py \
            scripts/build_cbb_venue_audit.py \
            scripts/build_cbb_projection_board.py \
            scripts/build_cbb_play_style.py \
            scripts/build_cbb_matchup_engine.py \
            scripts/build_cbb_intelligence_suite.py \
            scripts/build_cbb_model_tracking.py \
            scripts/build_cbb_bracketology.py \
            scripts/research_cbb_model_v02.py \
            scripts/build_cbb_game_day_readiness.py \
            scripts/build_cbb_operations_context.py \
            scripts/build_cbb_platform_health.py \
            scripts/build_prediction_archive.py \
            scripts/build_operations_readiness.py \
            scripts/run_cbb_opening_night_rehearsal.py \
            scripts/refresh_cbb_markets.py \
            scripts/validation_framework.py \
            scripts/build_trends_lab.py \
            scripts/build_variance_prospective_tracker.py \
            scripts/build_rlm_monitor.py
          python -m unittest \
            scripts/test_cbb_data_foundation.py \
            scripts/test_cbb_player_research.py \
            scripts/test_cbb_walk_forward_model.py \
            scripts/test_cbb_home_court.py \
            scripts/test_cbb_venue_audit.py \
            scripts/test_cbb_projection_board.py \
            scripts/test_cbb_play_style.py \
            scripts/test_cbb_matchup_engine.py \
            scripts/test_cbb_intelligence_suite.py \
            scripts/test_cbb_model_tracking.py \
            scripts/test_cbb_bracketology.py \
            scripts/test_cbb_model_v02.py \
            scripts/test_cbb_game_day_readiness.py \
            scripts/test_cbb_platform_health.py \
            scripts/test_cbb_opening_night_rehearsal.py \
            scripts/test_cbb_release_foundations.py \
            scripts/test_pregame_completion.py \
            scripts/test_refresh_cbb_markets.py \
            scripts/test_validation_framework.py \
            scripts/test_variance_lab.py

      - name: Refresh foundation, ratings, projections and bracketology
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CBB_SEASON: ${{ inputs.season || '2027' }}
          CBB_BENCHMARK_SEASON: ${{ inputs.benchmark_season || '2026' }}
          CBB_PLAYER_SOURCE_SEASON: ${{ inputs.benchmark_season || '2026' }}
          CBB_PLAYER_ROSTER_SEASON: ${{ inputs.season || '2027' }}
        run: |
          python scripts/build_cbb_data_foundation.py --output-dir data/cbb
          python scripts/build_cbb_player_research.py
          python scripts/build_cbb_walk_forward_model.py
          python scripts/build_cbb_home_court.py
          python scripts/build_cbb_venue_audit.py
          python scripts/build_cbb_projection_board.py
          python scripts/build_cbb_play_style.py --max-games 40
          python scripts/build_cbb_matchup_engine.py
          python scripts/build_cbb_model_tracking.py
          python scripts/build_cbb_bracketology.py
          python scripts/build_cbb_intelligence_suite.py
          python scripts/research_cbb_model_v02.py
          python scripts/build_cbb_game_day_readiness.py
          python scripts/build_cbb_operations_context.py
          python scripts/run_cbb_opening_night_rehearsal.py
          python scripts/build_cbb_platform_health.py
          python scripts/build_trends_lab.py
          python scripts/build_variance_prospective_tracker.py
          python scripts/build_rlm_monitor.py
          python scripts/build_prediction_archive.py
          python scripts/build_operations_readiness.py

      - name: Validate the coordinated release
        run: |
          sha256sum --check /tmp/cbb-platform-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/cbb")
          profiles = json.loads((root / "team_profiles.json").read_text())
          players = json.loads((root / "player_ratings.json").read_text())
          model = json.loads((root / "model/model_card.json").read_text())
          priors = json.loads((root / "model/current_priors.json").read_text())
          projections = json.loads((root / "projection_board.json").read_text())
          home_court = json.loads((root / "home_court_advantage.json").read_text())
          play_style = json.loads((root / "play_style.json").read_text())
          matchups = json.loads((root / "matchup_engine.json").read_text())
          tracking = json.loads((root / "model_tracking.json").read_text())
          bracket = json.loads((root / "bracketology.json").read_text())
          intelligence = json.loads((root / "intelligence_suite.json").read_text())
          challenger = json.loads((root / "research/model_v02_challenger.json").read_text())
          readiness = json.loads((root / "game_day_readiness.json").read_text())
          operations = json.loads((root / "operations_context.json").read_text())
          health = json.loads((root / "platform_health.json").read_text())
          venue_audit = json.loads((root / "venue_audit.json").read_text())
          rehearsal = json.loads((root / "opening_night_rehearsal.json").read_text())
          trends = json.loads(Path("data/trends_lab.json").read_text())

          assert len(profiles["teams"]) >= 300
          assert sum(bool(team.get("logo_url")) for team in profiles["teams"]) >= 300
          assert players["meta"]["version"] == "thi-cbb-player-research-v1.3"
          assert players["meta"]["player_count"] >= 1500
          assert all("prior_production_rating" in row["research_scores"] for row in players["players"])
          assert model["meta"]["model_version"] == "thi-cbb-walk-forward-v0.7-research"
          assert model["meta"]["historical_laboratory_version"] == "thi-cbb-historical-lab-v1.0"
          assert model["meta"]["four_factor_engine_version"] == "thi-cbb-opponent-adjusted-four-factors-v1.0"
          assert all(model["meta"]["leakage_audit"].values())
          assert len(model["evaluation"]["by_season"]) >= 8
          assert priors["meta"]["model_version"] == model["meta"]["model_version"]
          assert projections["meta"]["version"] == "thi-cbb-projection-board-v0.5"
          assert home_court["meta"]["version"] == "thi-cbb-home-court-v1.0"
          assert len(home_court["teams"]) >= 300
          assert all(0.5 <= row["home_court_points"] <= 5.5 for row in home_court["teams"])
          assert "Opponent-adjusted" in projections["meta"]["four_factor_method"]
          assert all("four_factor_matchup" in game["projection"]["matchup_context"] for game in projections["games"] if str(game.get("status", "")).lower() == "scheduled")
          assert projections["meta"]["model_version"] == model["meta"]["model_version"]
          assert play_style["meta"]["version"] == "thi-cbb-play-style-v1.0"
          assert play_style["meta"]["raw_play_by_play_stored"] is False
          assert matchups["meta"]["version"] == "thi-cbb-matchup-engine-v1.0"
          assert matchups["meta"]["model_usage"] == "display_only_research_layer"
          assert matchups["meta"]["game_count"] == projections["meta"]["game_count"]
          assert all(game["research_status"]["feeds_public_spread"] is False for game in matchups["games"])
          assert all(game["projection"]["model_input_label"] != "preseason_game" for game in projections["games"])
          assert tracking["meta"]["version"] == "thi-cbb-model-tracking-v0.1"
          assert tracking["meta"]["projection_board_version"] == projections["meta"]["version"]
          assert bracket["meta"]["version"] == "thi-cbb-bracketology-v0.3"
          assert bracket["meta"]["forecast_type"] in {"preseason_strength_scenario", "live_resume_projection"}
          assert len(bracket["field"]) == 68
          assert "active-roster quality" in bracket["meta"]["methodology"]
          assert all("roster_adjustment" in row for row in bracket["field"])
          assert intelligence["meta"]["version"] == "thi-cbb-intelligence-suite-v1.3"
          assert len(intelligence["player_projections"]) >= 1500
          assert len(intelligence["team_dossiers"]) >= 300
          assert len(intelligence["game_context"]) == projections["meta"]["game_count"]
          assert all("schedule_strength" in row and "projected_core_lineup" in row for row in intelligence["team_dossiers"])
          assert len(intelligence["validation_registry"]["factors"]) >= 8
          assert all(row["projected_points"] is None for row in intelligence["player_projections"] if row["projection_state"] == "role_only")
          assert challenger["meta"]["version"] == "thi-cbb-model-v0.2-challenger-lab"
          assert challenger["meta"]["published_model_unchanged"] is True
          assert "2022-2024 inner folds" in challenger["meta"]["selection_policy"]
          assert readiness["meta"]["version"] == "thi-cbb-game-day-readiness-v1.0"
          assert readiness["meta"]["status"] == "ready"
          assert len(readiness["checks"]) == 8
          assert all(readiness["checks"].values())
          assert operations["meta"]["version"] == "thi-cbb-operations-context-v1.0"
          assert operations["meta"]["model_usage"] == "display_only_research_layer"
          assert operations["coverage"]["games"] == projections["meta"]["game_count"]
          assert health["meta"]["version"] == "thi-cbb-platform-health-v1.0"
          assert health["meta"]["status"] == "healthy"
          assert health["checks"]["neutral_site_home_context_zero"] is True
          assert health["checks"]["neutral_venue_audit_ready"] is True
          assert health["checks"]["opening_night_rehearsal_passed"] is True
          assert venue_audit["meta"]["status"] == "healthy"
          assert venue_audit["summary"]["unresolved_reviews"] == 0
          assert rehearsal["meta"]["status"] == "passed"
          assert trends["meta"]["version"] == "thi-variance-systems-lab-v2.0"
          assert trends["sports"]["cfb"]["cards"] and trends["sports"]["cbb"]["cards"]
          PY

      - name: Commit the coordinated CBB outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/cbb/team_profiles.json \
            data/cbb/game_board.json \
            data/cbb/foundation_status.json \
            data/cbb/player_ratings.json \
            data/cbb/model/model_card.json \
            data/cbb/model/current_priors.json \
            data/cbb/model/walk_forward_predictions.json.gz \
            data/cbb/projection_board.json \
            data/cbb/home_court_advantage.json \
            data/cbb/play_style.json \
            data/cbb/matchup_engine.json \
            data/cbb/model_tracking.json \
            data/cbb/bracketology.json \
            data/cbb/intelligence_suite.json \
            data/cbb/research/model_v02_challenger.json \
            data/cbb/game_day_readiness.json
          git add \
            data/cbb/operations_context.json \
            data/cbb/platform_health.json \
            data/cbb/venue_audit.json \
            data/cbb/opening_night_rehearsal.json \
            data/trends_lab.json
          git add \
            data/variance/prospective_tracker.json \
            data/market/rlm_monitor.json
          git add \
            data/reports/prediction_archive.json \
            data/reports/operations_readiness.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh coordinated CBB platform data"
          git pull --rebase origin main
          git push origin HEAD:main
