name: Week 1 Projection Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Week 1 projection audit
        run: |
          python scripts/week1_projection_audit.py

      - name: Commit audit report
        run: |
          if git diff --quiet -- data/week1_projection_audit.json; then
            echo "No audit changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/week1_projection_audit.json
          git commit -m "Update Week 1 projection audit"
          git push
