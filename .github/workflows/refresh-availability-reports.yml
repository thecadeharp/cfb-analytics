name: Refresh Player Availability Reports

on:
  workflow_dispatch:
  schedule:
    # Poll hourly while official conference reports are being released/updated.
    - cron: "17 * * * 4,5,6"
    - cron: "17 12,18 * * 0,1,2,3"

permissions:
  contents: write

concurrency:
  group: thi-availability-writer
  cancel-in-progress: true

jobs:
  availability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install requests

      - name: Protect Model A and published projections
        run: |
          sha256sum \
            data/projections.json \
            data/cfb_metrics.json \
            data/hfa_2026.json \
            scripts/build_projections.py \
            > /tmp/model-a-before.sha256

      - name: Build fresh availability snapshot
        run: python scripts/build_availability_report.py

      - name: Test official-report normalization
        run: python -m unittest scripts.test_availability_report

      - name: Validate freshness and isolation
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          with open("data/roster_notes.json", encoding="utf-8") as file:
              data = json.load(file)

          assert data["meta"]["schema_version"] == "2.0"
          assert data["meta"]["model_usage"] == "display_and_signal_hold_not_used_by_model_a"
          assert set(data["meta"]["source_health"]) == {"ACC", "Big Ten", "Big 12", "SEC", "Pac-12", "ESPN"}
          now = datetime.now(timezone.utc)
          for notes in data.get("teams", {}).values():
              for note in notes:
                  verified = datetime.fromisoformat(note["verified_at_utc"].replace("Z", "+00:00"))
                  expires = datetime.fromisoformat(note["valid_until_utc"].replace("Z", "+00:00"))
                  assert note["source_url"].startswith("https://")
                  assert verified <= now + timedelta(minutes=10)
                  assert expires > now
                  assert expires - verified <= timedelta(days=7)
                  adjustment = note.get("availability_adjustment_points")
                  if adjustment is not None:
                      assert isinstance(adjustment, (int, float))
                      assert abs(adjustment) <= 10
                  if note.get("source_type") == "official_conference":
                      assert note.get("source_conference") in {"ACC", "Big Ten", "Big 12", "SEC", "Pac-12"}
                      assert isinstance(note.get("withhold_public_signal"), bool)
          PY
          sha256sum --check /tmp/model-a-before.sha256

      - name: Commit availability snapshot only
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roster_notes.json
          git diff --staged --quiet || git commit -m "Refresh player availability reports"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
