name: Build Historical Training Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pyarrow

      - name: Build SportsDataverse historical training table
        run: |
          python scripts/build_historical_training_data.py

      - name: Validate outputs exist
        run: |
          test -f data/training/historical_games.csv
          test -f data/training/historical_training_manifest.json

          python - <<'PY'
          import json
          import pandas as pd

          df = pd.read_csv("data/training/historical_games.csv")

          with open("data/training/historical_training_manifest.json") as f:
              manifest = json.load(f)

          print("Rows:", len(df))
          print(
              "Seasons:",
              sorted(
                  df["season"]
                  .dropna()
                  .astype(int)
                  .unique()
                  .tolist()
              ),
          )
          print(
              "2025 sealed rows:",
              int((df["season"] == 2025).sum()),
          )
          print("Columns:", len(df.columns))
          print(
              "Builder version:",
              manifest.get("builder_version"),
          )

          assert len(df) > 5000, (
              "Historical game table unexpectedly small"
          )
          assert set(range(2019, 2026)).issubset(
              set(
                  df["season"]
                  .dropna()
                  .astype(int)
              )
          )
          assert int((df["season"] == 2025).sum()) > 0
          assert manifest["sealed_test_season"] == 2025
          assert manifest["builder_version"] == "historical_training_v5_situational"
          assert df["season_type"].eq(2).all()
          assert df["actual_first_half_margin"].notna().sum() > 1000
          for field in ("off_iso_ppp", "off_script_epa", "off_leverage_epa", "off_red_zone_epa"):
              assert df[f"home_pregame_{field}"].notna().sum() > 1000
          PY

      - name: Audit split definitions and leakage
        run: |
          python scripts/audit_historical_training_data.py
          python - <<'PY'
          import json
          with open("data/training/historical_training_audit.json") as f:
              audit = json.load(f)
          assert audit["status"] == "PASS", audit["hard_failures"]
          PY

      - name: Commit generated training data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/training/historical_games.csv
          git add data/training/historical_training_manifest.json
          git add data/training/historical_training_audit.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Build SportsDataverse historical training data"
          git pull --rebase origin main
          git push
