name: Refresh Signal Report

on:
  workflow_dispatch:

  # Settlement runs at :45. Refresh ten minutes later.
  schedule:
    - cron: "55 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-signal-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Signal System v1 report
        run: |
          python scripts/build_signal_report.py

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/reports/signal_report.json

          if git diff --cached --quiet; then
            echo "No Signal report changes to commit."
            exit 0
          fi

          git commit -m "Refresh Signal System report"
          git pull --rebase origin main
          git push origin main
