name: THI Observed Ratings v0.1

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Team Metric Profiles"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: thi-data-writer
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Protect Model A files
        run: |
          sha256sum \
            data/projections.json \
            data/cfb_metrics.json \
            data/hfa_2026.json \
            scripts/build_projections.py \
            > /tmp/model-a-before.sha256

      - name: Build THI Observed Ratings
        run: python scripts/build_thi_observed_ratings.py

      - name: Validate ratings output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/thi_observed_ratings.json").read_text())
          meta = payload["meta"]
          teams = payload["teams"]

          assert meta["version"] == "0.1.2"
          assert meta["status"] == "PUBLIC_BETA"
          assert meta["model_usage"] == "display_only_not_used_by_model_a"
          assert meta["methodology"]["market_inputs"] is False
          assert meta["methodology"]["preseason_inputs"] is False
          assert meta["eligible_teams"] >= (80 if meta["through_week"] >= 3 else 0)
          assert meta["methodology"]["minimum_games"] == 2
          assert meta["eligible_teams"] + meta["provisional_teams"] <= len(teams)
          assert meta["qualifying_games"] >= 50
          assert len(teams) >= 100

          eligible = [team for team in teams.values() if team.get("eligible")]
          assert len(eligible) == meta["eligible_teams"]
          for team in eligible:
              ratings = team["ratings"]
              assert all(ratings.get(key) for key in ("offense", "defense", "net", "pace"))
              assert team["reliability"]["games"] >= 2

          provisional = [team for team in teams.values() if team.get("provisional")]
          assert len(provisional) == meta["provisional_teams"]
          for team in provisional:
              assert not team["eligible"]
              assert team["reliability"]["games"] == 1
              assert not team["ratings"]
              assert all(isinstance(team["provisional_ratings"].get(key), (int, float))
                         for key in ("offense", "defense", "net", "pace"))

          enriched = sum(
              all(team["metrics"][key]["offense"] and team["metrics"][key]["defense"]
                  for key in ("yards_per_play", "yards_per_rush", "yards_per_pass_play"))
              for team in eligible
          )
          assert enriched >= min(80, len(eligible)), f"Yardage metrics missing for too many teams: {enriched}"

          print(
              f"Validated THI Observed Ratings v{meta['version']} "
              f"for {meta['eligible_teams']} teams"
          )
          PY

      - name: Check THI Index input alignment
        id: index-inputs
        run: |
          python -m unittest discover -s scripts -p 'test_build_cfb_thi_index.py' -v
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          observed = json.loads(Path("data/thi_observed_ratings.json").read_text())
          predictive = json.loads(Path("data/thi_power_ratings.json").read_text())
          ready = observed["meta"]["through_week"] == predictive["meta"]["through_week"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
          print(
              "THI Index inputs aligned." if ready else
              "THI Index deferred until the predictive refresh reaches the observed week."
          )
          PY

      - name: Build independent THI CFB Index
        if: steps.index-inputs.outputs.ready == 'true'
        run: |
          python scripts/build_cfb_thi_index.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/cfb_thi_index.json").read_text())
          assert payload["meta"]["status"] == "INDEPENDENT_BETA"
          assert payload["meta"]["poll_inputs"] is False
          assert payload["meta"]["market_inputs"] is False
          assert payload["meta"]["roster_inputs"] is True
          assert payload["meta"]["preseason_inputs"] is True
          assert payload["meta"]["poll_based_preseason_inputs"] is False
          assert payload["meta"]["model_a_touched"] is False
          assert payload["meta"]["primary_surface"] == "power_rank"
          assert payload["meta"]["power_source_version"] == "thi_power_research_v0.3"
          assert payload["meta"]["power_source_status"] == "RESEARCH_ONLY"
          assert all("schedule_strength" in team["components"] for team in payload["teams"])
          assert len(payload["teams"]) == 138
          PY

      - name: Verify Model A remained unchanged
        run: sha256sum --check /tmp/model-a-before.sha256

      - name: Commit ratings and frozen weekly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thi_observed_ratings.json data/ratings_snapshots/ data/cfb_thi_index.json
          if git diff --cached --quiet; then
            echo "THI Observed Ratings unchanged."
            exit 0
          fi
          git commit -m "Refresh THI Observed Ratings v0.1"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
