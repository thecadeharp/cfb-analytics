name: Research Score Margin Challenger (2019-2024 Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow requests
      - name: Record protected files
        run: sha256sum data/projections.json data/cfb_metrics.json scripts/build_projections.py index.html app.js data/research/expected_points_clean_games_2019_2024.csv.gz > /tmp/thi-protected.sha256
      - name: Test chronology and feature isolation
        run: python -m unittest discover -s scripts -p test_expected_points_score_margin.py
      - name: Run one locked research comparison
        run: python scripts/research_expected_points_score_margin.py --source-dir /tmp/thi-pbp --download
      - name: Verify protected files
        if: always()
        run: sha256sum --check /tmp/thi-protected.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: research-score-margin-challenger
          path: data/research/expected_points_score_margin_challenger.json
          if-no-files-found: error
          retention-days: 30
