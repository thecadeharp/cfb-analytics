name: Prospective Projection Snapshots - No CFBD

on:
  workflow_dispatch:

  schedule:
    # During the CFB season, refresh market lines and capture a new
    # prospective snapshot four times per day.
    - cron: "15 4,10,16,22 * * *"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Refresh projections and current market without CFBD
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          USE_CACHED_SCHEDULE: "1"
        run: |
          python scripts/build_projections.py

      - name: Capture immutable projection and market snapshot
        run: |
          python scripts/snapshot_projections.py

      - name: Commit refreshed projections and snapshot ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/odds.json
          git add data/projections.json
          git add data/snapshots/projection_market_snapshots.jsonl
          git add data/snapshots/latest_snapshot.json

          if git diff --cached --quiet; then
            echo "No projection/snapshot changes to commit."
            exit 0
          fi

          git commit -m "Refresh market and capture prospective snapshot"

          # Another workflow or manual edit may push while this job is running.
          # Rebase onto the newest main before pushing so harmless races do not fail.
          git pull --rebase origin main
          git push origin main
