name: THI Situational Calibration Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install numpy pandas

      - name: Audit historical calibration and 2026 samples
        run: python scripts/audit_thi_situational_ratings.py

      - name: Confirm research-only output
        run: |
          python - <<'PY'
          import json
          with open('data/reports/thi_situational_calibration.json') as f:
              report = json.load(f)
          assert report['point_equivalent_published'] is False
          assert report['historical_2025_audit']['games'] >= 500
          print('Status:', report['status'])
          print('2025 diagnostic:', report['historical_2025_audit'])
          print('2026 sample counts:', report['live_2026'])
          PY

      - name: Attach calibration report
        uses: actions/upload-artifact@v4
        with:
          name: thi-situational-calibration
          path: data/reports/thi_situational_calibration.json
