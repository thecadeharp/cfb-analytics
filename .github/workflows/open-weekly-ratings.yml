name: Open Weekly Ratings - No CFBD

on:
  workflow_dispatch:
  schedule:
    # Tuesday morning, after the public weekly play-by-play file normally lands.
    - cron: "15 13 * * 2"

permissions:
  contents: write

concurrency:
  group: thi-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Protect Model A files
        run: |
          sha256sum \
            data/cfb_metrics.json \
            data/projections.json \
            scripts/build_projections.py \
            > /tmp/model-a-before.sha256

      - name: Refresh open advanced metrics
        run: python scripts/build_advanced_metrics.py

      - name: Build isolated open weekly ratings
        run: python scripts/build_open_weekly_ratings.py

      - name: Validate isolated output
        run: |
          python - <<'PY'
          import json
          data = json.load(open("data/open_weekly_ratings.json", encoding="utf-8"))
          assert data["meta"]["model_a_touched"] is False
          assert len(data["teams"]) >= 100
          assert data["meta"]["eligible_teams"] >= 20
          assert 0 <= data["meta"]["blend_weight"] <= 1
          print("Open weekly ratings validation passed")
          PY

      - name: Verify Model A remained unchanged
        run: sha256sum -c /tmp/model-a-before.sha256

      - name: Commit display-only outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/advanced_metrics.json data/open_weekly_ratings.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh open weekly ratings"
          git pull --rebase origin main
          git push origin HEAD:main
