name: Update CFB Analytics

on:
  workflow_dispatch:

  schedule:
    # Runs every Monday at 10:00 AM UTC
    - cron: "0 10 * * 1"

permissions:
  contents: write

jobs:
  update-analytics:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Update team analytics
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/weekly_update.py

      - name: Build projections
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/build_projections.py

      - name: Commit updated analytics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cfb_metrics.json
          git add data/schedule.json
          git add data/odds.json
          git add data/projections.json

          git diff --staged --quiet || git commit -m "Update CFB analytics data"

          git push
