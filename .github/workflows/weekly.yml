name: Update CFB Analytics

on:
  workflow_dispatch:

  schedule:
    # Runs every Monday at 10:00 AM UTC
    - cron: "0 10 * * 1"

permissions:
  contents: write

jobs:
  update-analytics:
    runs-on: ubuntu-latest

    steps:

      # Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install everything our scripts need
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # Run historical spread calibration audit
      - name: Audit spread calibration
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/calibrate_spreads.py

      # Run time-safe historical spread backtest
      - name: Backtest historical spreads
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/backtest_spreads.py

      # Update team analytics from CFBD
      - name: Update team analytics
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/weekly_update.py

      # Build schedules, odds, and projections
      - name: Build projections
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/build_projections.py

      # Save any updated data back into GitHub
      - name: Commit updated analytics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cfb_metrics.json
          git add data/schedule.json
          git add data/odds.json
          git add data/projections.json
          git add data/calibration_report.json
          git add data/backtest_report.json

          git diff --staged --quiet || git commit -m "Update CFB analytics data"

          git push
