name: Update CFB Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: write

concurrency:
  group: thi-data-writer
  cancel-in-progress: false

jobs:
  update-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify scheduled writer safety
        run: python -m unittest scripts/test_scheduled_writer_workflows.py -v

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Update team analytics
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/weekly_update.py

      - name: Build projections
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/build_projections.py

      - name: Build display-only THI season outlook
        run: |
          sha256sum \
            scripts/build_projections.py \
            data/cfb_metrics.json \
            data/schedule.json \
            data/projections.json \
            > /tmp/thi-outlook-source.sha256
          python -m unittest discover \
            -s scripts \
            -p 'test_build_thi_season_outlook.py' \
            -v
          python scripts/build_thi_season_outlook.py
          sha256sum --check /tmp/thi-outlook-source.sha256

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('data/thi_season_outlook.json').read_text())
          assert report['meta']['status'] == 'DISPLAY_ONLY'
          assert report['meta']['model_a_touched'] is False
          assert len(report['teams']) == 138
          assert report['history']
          PY

      - name: Commit updated analytics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cfb_metrics.json
          git add data/schedule.json
          git add data/odds.json
          git add data/projections.json
          git add data/thi_season_outlook.json

          if git diff --staged --quiet; then
            echo "No CFB analytics changes to commit."
            exit 0
          fi

          git commit -m "Update CFB analytics data"
          git pull --rebase origin main
          git push origin HEAD:main
