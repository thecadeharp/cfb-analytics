name: Production Data Freshness Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "4,34 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: thi-data-freshness-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test freshness contracts
        run: python -m unittest scripts.test_data_freshness -v
      - name: Audit production datasets
        id: freshness
        continue-on-error: true
        run: python scripts/audit_data_freshness.py --strict --output /tmp/thi-data-freshness.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thi-data-freshness-${{ github.run_id }}
          path: /tmp/thi-data-freshness.json
          retention-days: 14
      - name: Recover stale CFB production inputs
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/thi-critical-datasets.txt
          import json
          audit=json.load(open("/tmp/thi-data-freshness.json", encoding="utf-8"))
          failed=sorted({row.get("dataset") for row in audit.get("findings", []) if row.get("severity")=="critical"})
          print("\n".join(item for item in failed if item))
          PY

          if grep -Eq '^(cfb_scores|cfb_live_scores)$' /tmp/thi-critical-datasets.txt; then
            gh workflow run live-score-pulse.yml --ref main
            echo "Dispatched live-score recovery."
          fi

          if grep -Eq '^cfb_projections$' /tmp/thi-critical-datasets.txt; then
            gh workflow run refresh-projections-no-cfbd.yml --ref main
            echo "Dispatched projection-board recovery."
          fi

          if grep -Eq '^cfb_availability$' /tmp/thi-critical-datasets.txt; then
            gh workflow run refresh-availability-reports.yml --ref main
            echo "Dispatched availability recovery."
          fi
      - name: Preserve failing audit status
        if: steps.freshness.outcome == 'failure'
        run: exit 1
