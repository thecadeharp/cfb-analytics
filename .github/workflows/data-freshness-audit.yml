name: Production Data Freshness Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "4,34 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: thi-data-freshness-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test freshness contracts
        run: python -m unittest scripts.test_data_freshness -v
      - name: Audit production datasets
        id: freshness
        continue-on-error: true
        run: python scripts/audit_data_freshness.py --strict --output /tmp/thi-data-freshness.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thi-data-freshness-${{ github.run_id }}
          path: /tmp/thi-data-freshness.json
          retention-days: 14
      - name: Recover stale production inputs
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/thi-critical-datasets.txt
          import json
          audit=json.load(open("/tmp/thi-data-freshness.json", encoding="utf-8"))
          failed=sorted({row.get("dataset") for row in audit.get("findings", []) if row.get("severity")=="critical"})
          print("\n".join(item for item in failed if item))
          PY

          : > /tmp/thi-recovery-workflows.txt
          dispatch_recovery() {
            local workflow="$1"
            shift
            local previous_run
            previous_run=$(gh run list \
              --workflow "$workflow" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            local attempt
            for attempt in 1 2 3 4; do
              if gh workflow run "$workflow" --ref main "$@"; then
                break
              fi
              if [[ "$attempt" -eq 4 ]]; then
                echo "Could not dispatch $workflow after $attempt attempts."
                return 1
              fi
              echo "GitHub did not accept the $workflow dispatch; retrying in $((attempt * 10)) seconds."
              sleep $((attempt * 10))
            done
            printf '%s|%s\n' "$workflow" "$previous_run" >> /tmp/thi-recovery-workflows.txt
          }

          if grep -Eq '^(cfb_postgame|cfb_signal_records)$' /tmp/thi-critical-datasets.txt; then
            dispatch_recovery settle-results-no-cfbd.yml
            echo "Dispatched settlement and downstream analytics recovery."
          elif grep -Eq '^(cfb_scores|cfb_live_scores)$' /tmp/thi-critical-datasets.txt; then
            dispatch_recovery live-score-pulse.yml -f one_shot=true
            echo "Dispatched live-score recovery."
          fi

          if grep -Eq '^cfb_projections$' /tmp/thi-critical-datasets.txt; then
            dispatch_recovery refresh-projections-no-cfbd.yml
            echo "Dispatched projection-board recovery."
          fi

          if grep -Eq '^cfb_availability$' /tmp/thi-critical-datasets.txt; then
            dispatch_recovery refresh-availability-reports.yml
            echo "Dispatched availability recovery."
          fi

          if grep -Eq '^players_through_week$' /tmp/thi-critical-datasets.txt; then
            dispatch_recovery player-intelligence-v1.yml
            echo "Dispatched player-intelligence recovery."
          fi

          if grep -Eq '^cbb_(projection_board|team_profiles|platform_health|market_contract)$' /tmp/thi-critical-datasets.txt; then
            dispatch_recovery refresh-cbb-platform.yml
            echo "Dispatched coordinated CBB platform recovery."
          fi

          python - <<'PY'
          from pathlib import Path

          supported = {
              "cfb_postgame",
              "cfb_signal_records",
              "cfb_scores",
              "cfb_live_scores",
              "cfb_projections",
              "cfb_availability",
              "players_through_week",
              "cbb_projection_board",
              "cbb_team_profiles",
              "cbb_platform_health",
              "cbb_market_contract",
          }
          failed = {
              line.strip()
              for line in Path("/tmp/thi-critical-datasets.txt").read_text().splitlines()
              if line.strip()
          }
          unsupported = sorted(failed - supported)
          if unsupported:
              raise SystemExit(
                  "No automatic recovery exists for critical datasets: "
                  + ", ".join(unsupported)
              )
          PY

          if [[ ! -s /tmp/thi-recovery-workflows.txt ]]; then
            echo "No automatic recovery exists for the critical findings:"
            cat /tmp/thi-critical-datasets.txt
            exit 1
          fi

          while IFS='|' read -r workflow previous_run; do
            run_id=""
            for attempt in {1..12}; do
              run_id=$(gh run list \
                --workflow "$workflow" \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty')
              [[ -n "$run_id" && "$run_id" != "$previous_run" ]] && break
              run_id=""
              sleep 5
            done
            if [[ -z "$run_id" ]]; then
              echo "Could not locate the recovery run for $workflow."
              exit 1
            fi
            echo "Waiting for $workflow recovery run $run_id."
            gh run watch "$run_id" --exit-status
          done < /tmp/thi-recovery-workflows.txt

      - name: Verify recovered production datasets
        if: steps.freshness.outcome == 'failure'
        run: |
          git fetch origin main
          git checkout --force origin/main
          python scripts/audit_data_freshness.py --strict --output /tmp/thi-data-freshness-recovered.json
      - name: Upload recovery verification
        if: ${{ steps.freshness.outcome == 'failure' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: thi-data-freshness-recovered-${{ github.run_id }}
          path: /tmp/thi-data-freshness-recovered.json
          if-no-files-found: ignore
          retention-days: 14
