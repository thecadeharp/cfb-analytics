name: THI Power Candidate v0.3 - Roster Decay Research

on:
  workflow_dispatch:
    inputs:
      through_week:
        description: 'Completed 2026 week'
        required: true
        default: '4'
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENBLAS_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          python -m pip install numpy==2.3.5 pandas==2.2.3 pyarrow==25.0.1

      - name: Protect Model A, site and current published ratings
        run: |
          sha256sum \
            scripts/build_projections.py \
            data/cfb_metrics.json \
            data/projections.json \
            app.js \
            index.html \
            thi-ratings-hub.js \
            data/thi_power_ratings.json \
            data/thi_observed_ratings.json \
            > /tmp/thi-v03-protected.sha256

      - uses: actions/cache@v4
        with:
          path: /tmp/thi-power-inputs
          key: thi-power-public-inputs-v3

      - name: Test decay contract
        run: |
          python -m unittest discover \
            -s scripts \
            -p 'test_research_thi_power.py' \
            -v

          python -m unittest discover \
            -s scripts \
            -p 'test_research_thi_power_v03.py' \
            -v

      - name: Compare locked decay schedules
        env:
          THROUGH_WEEK: ${{ inputs.through_week }}
        run: |
          python scripts/research_thi_power.py \
            --input-dir /tmp/thi-power-inputs \
            --output-dir /tmp/thi-power-v02 \
            --download \
            --through-week "$THROUGH_WEEK"

          python scripts/research_thi_power_v03.py \
            --input-dir /tmp/thi-power-inputs \
            --output-dir /tmp/thi-power-v03 \
            --through-week "$THROUGH_WEEK"

      - name: Verify candidate and protected files
        run: |
          sha256sum --check /tmp/thi-v03-protected.sha256

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "/tmp/thi-power-v03/thi_power_candidate_v03.json"
              ).read_text()
          )

          expected_fields = {
              "team_id",
              "team",
              "rating",
              "previous_week_same_model_rating",
              "performance_only_weekly_change",
              "qualifying_games",
              "missing_prior_fields",
              "prior_contribution",
              "result_elo_contribution",
              "roster_contribution",
              "performance_contribution",
              "missingness_contribution",
              "centering_offset",
              "rank"
          }

          assert report["meta"]["model_a_touched"] is False
          assert report["meta"]["sealed_2025_used"] is False
          assert report["meta"]["selected_decay_rate"] == 0.15
          assert report["meta"]["season"] == 2026
          assert len(report["teams"]) == 138
          assert all(
              set(team) == expected_fields
              for team in report["teams"]
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: thi-power-candidate-v03
          path: /tmp/thi-power-v03/thi_power_candidate_v03.json
          if-no-files-found: error
          retention-days: 90
