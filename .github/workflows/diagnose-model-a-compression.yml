name: Diagnose Model A Compression

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-model-a-compression
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen Week 1 baseline exists
        shell: bash
        run: |
          set -euo pipefail
          test -f data/frozen/2026_week1_modelA_frozen.json
          test -f data/frozen/2026_week1_modelA_frozen.sha256
          test -f data/frozen/2026_week1_modelA_frozen_manifest.txt
          sha256sum -c data/frozen/2026_week1_modelA_frozen.sha256

      - name: Run isolated compression diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python scripts/diagnose_model_a_compression.py

      - name: Prove production files were not modified
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- \
            data/projections.json \
            data/frozen/2026_week1_modelA_frozen.json \
            data/cfb_metrics.json \
            data/hfa_2026.json \
            app.js \
            scripts/build_projections.py; then
            echo "ERROR: diagnostic modified a protected production file."
            git diff -- \
              data/projections.json \
              data/frozen/2026_week1_modelA_frozen.json \
              data/cfb_metrics.json \
              data/hfa_2026.json \
              app.js \
              scripts/build_projections.py
            exit 1
          fi

      - name: Commit diagnostic report only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/reports/model_a_compression_diagnostic.json \
            data/reports/model_a_compression_diagnostic.txt

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Run Model A compression diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
