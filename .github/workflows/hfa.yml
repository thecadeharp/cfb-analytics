name: Calibrate CFB Home Field Advantage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate-hfa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calibrate team home-field advantage
        run: |
          python scripts/calibrate_hfa.py

      - name: Commit HFA ratings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/hfa_ratings.json

          git diff --staged --quiet || git commit -m "Update team home-field ratings"

          git push
