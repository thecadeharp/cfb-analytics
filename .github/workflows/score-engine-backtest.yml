name: Score Engine Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest-score-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run modular score engine backtest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/backtest_score_engine.py

      - name: Commit backtest report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/score_engine_backtest.json

          git diff --staged --quiet || git commit -m "Update score engine backtest"
          git push
