name: Sealed 2025 Training Table Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run sealed 2025 test
        run: |
          python scripts/validate_training_table_2025.py

      - name: Commit sealed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/training/sealed_2025_score_engine.json

          if git diff --cached --quiet; then
            echo "No sealed-report changes to commit."
            exit 0
          fi

          git commit -m "Run sealed 2025 training-table test"
          git push
