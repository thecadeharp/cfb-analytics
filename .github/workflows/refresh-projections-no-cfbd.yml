name: Refresh Projections - No CFBD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-projections-no-cfbd
  cancel-in-progress: false

jobs:
  refresh-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Build projections from cached schedule
        env:
          USE_CACHED_SCHEDULE: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/build_projections.py

      - name: Commit refreshed projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/odds.json
          git add data/projections.json

          if git diff --cached --quiet; then
            echo "No projection changes to commit."
            exit 0
          fi

          git commit -m "Refresh projections without CFBD"
          git pull --rebase origin main
          git push origin main
