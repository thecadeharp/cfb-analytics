name: Settle Results - No CFBD

on:
  workflow_dispatch:

  # Run hourly, seven days a week.
  # GitHub Actions cron uses FIVE fields:
  # minute hour day-of-month month day-of-week
  schedule:
    - cron: "45 * * * *"

permissions:
  contents: write

concurrency:
  group: settle-results-no-cfbd
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch all completed 2026 season results without CFBD
        env:
          CFB_SEASON: "2026"
        run: |
          python scripts/fetch_results_no_cfbd.py

      - name: Settle prospective projections
        run: |
          python scripts/settle_results.py

      - name: Commit settlement outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/results.json
          git add data/reports/settled_results.json
          git add data/reports/settled_snapshot_rows.csv

          if git diff --cached --quiet; then
            echo "No settlement changes to commit."
            exit 0
          fi

          git commit -m "Settle completed games and refresh model report"
          git pull --rebase origin main
          git push origin main
