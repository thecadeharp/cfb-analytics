name: Settle Results + Live Scores - No CFBD

on:
  workflow_dispatch:

  # Refresh scoreboard state every 5 minutes.
  # This powers LIVE rows, catches finals quickly, refreshes public signal
  # records, and automatically builds retrospective postgame analytics.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: settle-results-no-cfbd
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow

      - name: Fetch live and completed 2026 scores without CFBD
        env:
          CFB_SEASON: "2026"
        run: |
          python scripts/fetch_results_no_cfbd.py

      - name: Settle prospective projections
        run: |
          python scripts/settle_results.py

      - name: Build postgame analytics
        env:
          CFB_SEASON: "2026"
        run: |
          python scripts/build_postgame_analytics.py

      - name: Refresh Signal System accountability report
        run: |
          python scripts/build_signal_report.py

      - name: Commit scoreboard, settlement, postgame, and signal outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/results.json
          git add data/live_scores.json
          git add data/postgame_analytics.json
          git add data/reports/settled_results.json
          git add data/reports/settled_snapshot_rows.csv
          git add data/reports/signal_report.json

          if git diff --cached --quiet; then
            echo "No scoreboard, settlement, postgame, or signal changes to commit."
            exit 0
          fi

          git commit -m "Refresh live scores, settlements, postgame analytics, and signal records"
          git pull --rebase origin main
          git push origin main
