name: Score Engine V1.4 OOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run V1.4 realized possession/scoring OOS experiment
        run: |
          python scripts/score_engine_v14_oos.py

      - name: Commit V1.4 OOS report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/training/score_engine_v14_oos.json

          if git diff --cached --quiet; then
            echo "No V1.4 report changes to commit."
            exit 0
          fi

          git commit -m "Run Score Engine V1.4 OOS experiment"
          git push
