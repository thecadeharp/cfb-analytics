name: Build CFB Portal Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * 1"

concurrency:
  group: thi-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check requests
      - run: python -m unittest scripts.test_cfb_portal_intelligence
      - name: Build verified portal positions
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/build_cfb_portal_intelligence.py
      - name: Commit artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portal_2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh CFB portal intelligence"
          git pull --rebase origin main
          git push origin HEAD:main
