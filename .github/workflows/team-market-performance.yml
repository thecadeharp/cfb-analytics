name: Build Team Market Performance

on:
  workflow_dispatch:
  schedule:
    # Weekly accountability refresh after the weekend slate is settled.
    - cron: "45 11 * * 1"

permissions:
  contents: write

concurrency:
  group: thi-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ATS and cover-margin profiles
        run: python scripts/build_team_market_performance.py
      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team_market_performance.json
          if git diff --cached --quiet; then
            echo "Team market performance unchanged."
            exit 0
          fi
          git commit -m "Refresh team market performance"
          git pull --rebase origin main
          git push
