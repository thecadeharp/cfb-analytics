name: Weather Engine v1

on:
  workflow_dispatch:
  schedule:
    # Rebuild forecast + adjustments every 3 hours.
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: weather-engine-v1
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Weather Engine frontend once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          tag = '  <script src="ux-v2.js"></script>'

          if tag in text:
              print("ux-v2.js already installed.")
          else:
              needle = '  <script src="app.js"></script>'
              if needle not in text:
                  raise SystemExit("Could not find app.js script tag; refusing to modify index.html.")

              text = text.replace(needle, needle + "\n" + tag, 1)
              path.write_text(text, encoding="utf-8")
              print("Installed ux-v2.js after app.js.")
          PY

      - name: Build Weather Engine v1
        run: python scripts/build_game_conditions.py

      - name: Verify protected Model A files were not modified
        run: |
          git diff --exit-code -- \
            app.js \
            data/projections.json \
            data/frozen/2026_week1_modelA_frozen.json \
            data/cfb_metrics.json \
            data/hfa_2026.json \
            scripts/build_projections.py

      - name: Verify only approved generated files changed
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              "index.html",
              "data/game_conditions.json",
          }

          changed = set(
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          )

          untracked = set(
              line.strip()
              for line in subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"],
                  text=True,
              ).splitlines()
              if line.strip()
          )

          unexpected = (changed | untracked) - allowed
          if unexpected:
              raise SystemExit(f"Unexpected changed files: {sorted(unexpected)}")

          print(f"Approved generated changes: {sorted(changed | untracked)}")
          PY

      - name: Commit and safely push refreshed weather output
        run: |
          if git diff --quiet -- index.html data/game_conditions.json && \
             [ -z "$(git ls-files --others --exclude-standard data/game_conditions.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html data/game_conditions.json
          git commit -m "Refresh Weather Engine v1"

          # Other scheduled workflows also write to main. Rebase onto the
          # newest main before each push attempt so a harmless concurrent bot
          # commit cannot cause this workflow to fail with "fetch first".
          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected; refusing to overwrite remote changes."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Weather Engine v1 pushed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 3))
            fi
          done

          echo "Push failed after 4 safe retry attempts."
          exit 1
