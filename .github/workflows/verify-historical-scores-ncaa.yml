name: Verify Historical Scores Against NCAA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thi-independent-score-research
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install historical research dependencies
        run: pip install pandas numpy requests pyarrow
      - name: Preserve production files
        run: sha256sum data/projections.json data/cfb_metrics.json scripts/build_projections.py > /tmp/thi-model-a-before.sha256
      - name: Verify 2025 reconstructed scores against NCAA
        run: python scripts/verify_historical_scores_ncaa.py
      - name: Verify report and production files
        run: |
          sha256sum --check /tmp/thi-model-a-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('data/research/independent_score_audit_2025.json').read_text())
          assert result['meta']['status'] == 'research_only_cross_source_score_check'
          assert result['comparison']['matched_official_final'] >= 300
          assert len(result['weeks']) == 15
          PY
      - name: Commit audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/independent_score_audit_2025.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cross-check historical scoring against NCAA finals"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
