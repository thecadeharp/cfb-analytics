name: Sealed 2025 Score Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sealed-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cache-only sealed 2025 test
        run: |
          python scripts/validate_score_engine_2025.py

      - name: Commit sealed report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/score_engine_2025_sealed.json

          git diff --staged --quiet || git commit -m "Update sealed 2025 score test"
          git push
