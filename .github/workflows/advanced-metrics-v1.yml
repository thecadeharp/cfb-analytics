name: Advanced Metrics v2

on:
  workflow_dispatch:

  schedule:
    # Refresh every Monday after the main weekly analytics update.
    - cron: "30 11 * * 1"

permissions:
  contents: write

jobs:
  build-advanced-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow

      - name: Protect Model A files
        run: |
          sha256sum \
            data/projections.json \
            data/cfb_metrics.json \
            data/hfa_2026.json \
            scripts/build_projections.py \
            > /tmp/model-a-before.sha256

      - name: Build advanced metrics
        run: |
          python scripts/build_advanced_metrics.py

      - name: Verify Model A remained unchanged
        run: |
          sha256sum --check /tmp/model-a-before.sha256

      - name: Validate advanced metrics output
        run: |
          python - <<'PY'
          import json
          with open("data/advanced_metrics.json", encoding="utf-8") as file:
              data = json.load(file)
          assert data["meta"]["model_usage"] == "display_only_not_used_by_model_a"
          assert len(data.get("teams", {})) >= 100
          sample = next(
              team["non_garbage"]["offense"]
              for team in data["teams"].values()
              if team["non_garbage"]["offense"].get("n_plays", 0) >= 35
          )
          required = {
              "yards_per_play",
              "yards_per_rush",
              "yards_per_pass_play",
              "iso_ppp",
              "standard_down_epa",
              "passing_down_epa",
              "opportunity_rate",
              "adjusted_sack_rate",
              "havoc_rate",
              "available_yards_pct",
              "drive_scoring_rate",
              "points_per_opportunity",
              "red_zone_td_rate",
              "red_zone_scoring_rate",
              "fumble_recovery_delta",
              "third_down_conversion_delta",
              "situational_iso_ppp",
              "situational_iso_successful_plays",
              "script_early_epa",
              "script_early_success_rate",
              "script_early_plays",
              "leverage_epa",
              "leverage_success_rate",
              "leverage_plays",
              "situational_red_zone_epa",
              "situational_red_zone_plays",
          }
          missing = required.difference(sample)
          assert not missing, f"Advanced Metrics v2 fields missing: {sorted(missing)}"
          assert len(data["meta"].get("game_ids", [])) >= 50
          assert sum(
              team["non_garbage"]["offense"].get("script_early_plays", 0) >= 10
              for team in data["teams"].values()
          ) >= 80, "Historical-aligned first-half split has insufficient coverage"
          print("Advanced metrics validation passed")
          PY

      - name: Commit advanced metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/advanced_metrics.json
          git diff --staged --quiet || git commit -m "Refresh advanced team metrics"
          git push
