name: Advanced Metrics v1

on:
  workflow_dispatch:

  schedule:
    # Refresh every Monday after the main weekly analytics update.
    - cron: "30 11 * * 1"

permissions:
  contents: write

jobs:
  build-advanced-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow

      - name: Protect Model A files
        run: |
          sha256sum \
            data/projections.json \
            data/cfb_metrics.json \
            data/hfa_2026.json \
            scripts/build_projections.py \
            > /tmp/model-a-before.sha256

      - name: Build advanced metrics
        run: |
          python scripts/build_advanced_metrics.py

      - name: Verify Model A remained unchanged
        run: |
          sha256sum --check /tmp/model-a-before.sha256

      - name: Validate advanced metrics output
        run: |
          python - <<'PY'
          import json
          with open("data/advanced_metrics.json", encoding="utf-8") as file:
              data = json.load(file)
          assert data["meta"]["model_usage"] == "display_only_not_used_by_model_a"
          assert len(data.get("teams", {})) >= 100
          print("Advanced metrics validation passed")
          PY

      - name: Commit advanced metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/advanced_metrics.json
          git diff --staged --quiet || git commit -m "Refresh advanced team metrics"
          git push
