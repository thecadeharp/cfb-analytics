name: Capture Closing Lines - No CFBD

on:
  workflow_dispatch:

  schedule:
    - cron: "20 * * * 4,5,6"

permissions:
  contents: write

jobs:
  capture-closing-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Refresh current market without CFBD
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          USE_CACHED_SCHEDULE: "1"
        run: |
          python scripts/build_projections.py

      - name: Capture near-kickoff closing lines
        run: |
          python scripts/capture_closing_lines.py

      - name: Commit closing-line captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/odds.json
          git add data/projections.json
          git add data/snapshots/closing_lines.jsonl
          git add data/snapshots/latest_closing_capture.json

          if git diff --cached --quiet; then
            echo "No closing-line changes to commit."
            exit 0
          fi

          git commit -m "Capture near-kickoff closing lines"
          git push
