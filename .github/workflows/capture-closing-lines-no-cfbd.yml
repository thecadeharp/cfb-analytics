name: Capture Closing Lines - No CFBD

on:
  workflow_dispatch:

  # Run hourly, seven days a week.
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: capture-closing-lines-no-cfbd
  cancel-in-progress: false

jobs:
  capture-closing-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Refresh current market without CFBD
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          USE_CACHED_SCHEDULE: "1"
        run: |
          python scripts/build_projections.py

      - name: Capture near-kickoff closing lines
        run: |
          python scripts/capture_closing_lines.py

      - name: Build CLV report
        run: |
          python scripts/build_clv_report.py

      - name: Commit closing-line captures and CLV report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/odds.json
          git add data/projections.json

          if [ -f data/snapshots/latest_closing_capture.json ]; then
            git add data/snapshots/latest_closing_capture.json
          fi

          if [ -f data/snapshots/closing_lines.jsonl ]; then
            git add data/snapshots/closing_lines.jsonl
          fi

          if [ -f data/reports/clv_report.json ]; then
            git add data/reports/clv_report.json
          fi

          if [ -f data/reports/clv_snapshot_rows.csv ]; then
            git add data/reports/clv_snapshot_rows.csv
          fi

          if git diff --cached --quiet; then
            echo "No closing-line or CLV report changes to commit."
            exit 0
          fi

          git commit -m "Capture closing lines and refresh CLV report"
          git pull --rebase origin main
          git push origin main
